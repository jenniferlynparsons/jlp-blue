<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now page share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
.paper{background-color:#F6F8FC;background-image:linear-gradient(#DCE4F1 1px,transparent 1px),linear-gradient(90deg,#DCE4F1 1px,transparent 1px);background-size:24px 24px}
</style>
</head>
<body>
<div class="paper" style="width: 1200px; height: 630px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Newsreader', Georgia, serif; color: #14275E">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">jlp.blue/now</span>
<span style="font-size: 72px; font-weight: 500; line-height: 1">Now</span>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; border: 2px solid #1B3A8C; background: #FFFFFF; padding: 6px 12px; transform: rotate(-3deg)">2026·11·23</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<div style="background: #FFFFFF; border: 2px solid #1B3A8C; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.1em">READING</span>
<span style="font-size: 24px; line-height: 1.25; font-style: italic">[Book title]</span>
</div>
<div style="background: #FFFFFF; border: 2px solid #1B3A8C; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.1em">WATCHED</span>
<span style="font-size: 24px; line-height: 1.25; font-style: italic">[Film or show]</span>
</div>
<div style="background: #FFFFFF; border: 2px solid #1B3A8C; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.1em">MAKING</span>
<span style="font-size: 24px; line-height: 1.25">Rebuilding this site</span>
</div>
<div style="background: #FFFFFF; border: 2px solid #1B3A8C; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.1em">INTO</span>
<span style="font-size: 24px; line-height: 1.25">Learning hockey</span>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid #1B3A8C; padding-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 20px">
<span>Jennifer Lyn Parsons</span>
<span style="color: #3B4C7A">what I'm reading, making, and into</span>
</div>
</div>
</body>
</html>
